.main>.page:not(:has(.chat-workspace))>.page-header{width:100%;max-width:1480px;margin-inline:auto;margin-bottom:24px}
.workspace-strip,.two-pane{width:100%!important;max-width:1480px!important;margin-inline:auto!important;min-width:0!important;align-self:stretch!important}
.two-pane{display:grid!important;grid-template-columns:minmax(260px,.82fr) minmax(0,1.45fr)!important;gap:16px!important;min-height:560px}
.two-pane>.surface{min-width:0!important;width:100%!important}
.file-list{min-width:0;max-height:min(62vh,680px);overflow:auto}
.file-preview{width:100%;min-width:0;max-width:100%;min-height:420px;max-height:70vh;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
.terminal{width:100%!important;max-width:1480px!important;margin-inline:auto!important;min-width:0!important}
.terminal-output{height:clamp(300px,52vh,680px);min-height:260px;max-height:calc(100dvh - 300px);overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
.terminal-head,.terminal-input{min-width:0;flex-wrap:wrap}
.terminal-head>span:last-child{min-width:0;overflow-wrap:anywhere;text-align:end}
.terminal-input .input{flex:1 1 240px;min-width:0}
@media(max-width:1000px){
 .two-pane{grid-template-columns:minmax(0,1fr)!important;min-height:0}
 .file-list{max-height:300px}
 .file-preview{min-height:280px;max-height:55vh}
}
@media(max-width:760px){
 .main>.page:not(:has(.chat-workspace)){padding:22px 14px 30px!important}
 .two-pane{gap:12px!important}
 .terminal-output{height:48vh;min-height:220px;max-height:calc(100dvh - 250px);padding:12px;font-size:12px}
 .terminal-input{align-items:stretch}
 .terminal-input .button{flex:0 0 auto}
}
@media(max-width:420px){
 .terminal-head{align-items:flex-start;flex-direction:column}
 .terminal-input .button{flex:1 1 auto}
}


.auth-screen{height:100%;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text)}.auth-card{width:min(100%,430px);padding:44px 38px 32px;border:1px solid var(--line);border-radius:24px;background:var(--surface);box-shadow:var(--shadow);text-align:center}.auth-mark{width:52px;height:52px;margin:0 auto 22px;border-radius:16px;background:var(--text);color:var(--bg);display:grid;place-items:center;font-size:27px;font-weight:850;letter-spacing:-.08em}.auth-kicker{font-size:9px;letter-spacing:.2em;color:var(--muted);font-weight:750}.auth-card h1{font-size:32px;letter-spacing:-.045em;margin:12px 0 10px;font-weight:650}.auth-copy{font-size:13px;line-height:1.7;color:var(--muted);margin:0 auto 26px;max-width:310px}.google-signin{width:100%;height:50px;display:flex;align-items:center;justify-content:center;gap:12px;border:1px solid var(--line);border-radius:12px;background:var(--text);color:var(--bg);font-weight:650;font-size:13px;transition:transform .18s ease,opacity .18s ease}.google-signin:hover:not(:disabled){transform:translateY(-1px)}.google-signin:disabled{opacity:.4;cursor:not-allowed}.google-signin svg{width:18px;height:18px;background:white;border-radius:50%;padding:2px}.auth-foot{margin-top:17px;color:var(--subtle);font-size:10px}.auth-brand{margin-top:38px;padding-top:20px;border-top:1px solid var(--line);font-size:11px;font-weight:800;letter-spacing:.18em}.auth-brand span{margin-left:8px;color:var(--subtle);font-size:8px;font-weight:600}.auth-error{margin:0 0 15px;padding:11px 13px;border:1px solid color-mix(in srgb,#b65d5d 35%,var(--line));border-radius:10px;color:var(--muted);font-size:11px;line-height:1.6;text-align:left}.auth-error code{font-size:10px}@media(max-width:480px){.auth-card{padding:34px 22px 26px}.auth-card h1{font-size:28px}}
</style>
</head>

<div id="root"><div style="height:100%;display:grid;place-items:center;color:#92928f;font:12px system-ui">Loading H2O Workspace…</div></div>
